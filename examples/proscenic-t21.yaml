esphome:
  name: proscenic-t21
  friendly_name: Proscenic T21

packages:
  # Para uso local: copiar tambien la carpeta packages junto a este archivo
  # y cambiar esta ruta a !include packages/proscenic-t21.yaml.
  t21: !include ../packages/proscenic-t21.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

api:
  encryption:
    key: !secret t21_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret t21_ota_password
