# Integracion local validada en una Proscenic T21 real.
# Los controles escriben exclusivamente datapoints documentados y observados.
esphome:
  min_version: 2026.8.2

esp8266:
  board: d1_mini
  restore_from_flash: false

logger:
  baud_rate: 0
  level: DEBUG
  logs:
    tuya: DEBUG

uart:
  id: t21_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  parity: NONE
  stop_bits: 1

tuya:
  id: t21_mcu
  uart_id: t21_uart
  on_datapoint_update:
    - sensor_datapoint: 3
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) {
              case 0: id(t21_programa).publish_state("Ninguno"); break;
              case 1: id(t21_programa).publish_state("Patatas"); break;
              case 2: id(t21_programa).publish_state("Gambas"); break;
              case 3: id(t21_programa).publish_state("Pizza"); break;
              case 4: id(t21_programa).publish_state("Pollo"); break;
              case 5: id(t21_programa).publish_state("Pescado"); break;
              case 6: id(t21_programa).publish_state("Filete"); break;
              case 7: id(t21_programa).publish_state("Muffin"); break;
              case 8: id(t21_programa).publish_state("Bacon"); break;
              case 9: id(t21_programa).publish_state("Precalentar"); break;
              case 10: id(t21_programa).publish_state("Personalizado"); break;
              default: id(t21_programa).publish_state(str_sprintf("Desconocido (%u)", x));
            }
    - sensor_datapoint: 5
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) {
              case 0: id(t21_estado).publish_state("En espera"); break;
              case 1: id(t21_estado).publish_state("Inicio diferido"); break;
              case 2: id(t21_estado).publish_state("Cocinando"); break;
              case 3: id(t21_estado).publish_state("Mantener caliente"); break;
              case 4: id(t21_estado).publish_state("Apagada"); break;
              case 5: id(t21_estado).publish_state("Finalizada"); break;
              default: id(t21_estado).publish_state(str_sprintf("Desconocido (%u)", x));
            }
    - sensor_datapoint: 103
      datapoint_type: int
      then:
        - lambda: |-
            id(t21_temperatura_control).publish_state(
              roundf((static_cast<float>(x) - 32.0f) * 5.0f / 9.0f)
            );

binary_sensor:
  - platform: status
    name: Conexion ESPHome
    entity_category: diagnostic
  - platform: tuya
    name: Encendida
    sensor_datapoint: 1
    device_class: power
  - platform: tuya
    name: Coccion iniciada
    sensor_datapoint: 2
    device_class: running
  - platform: tuya
    name: Cesta retirada
    sensor_datapoint: 102
    device_class: opening
  - platform: tuya
    name: Mantener caliente activo
    sensor_datapoint: 104
  - platform: tuya
    name: Inicio diferido activo
    sensor_datapoint: 106

switch:
  - platform: tuya
    name: Encendido
    switch_datapoint: 1
    icon: mdi:power
  - platform: tuya
    name: Iniciar o pausar coccion
    switch_datapoint: 2
    icon: mdi:play-pause
  - platform: tuya
    name: Mantener caliente
    switch_datapoint: 104
    icon: mdi:heat-wave
  - platform: tuya
    name: Inicio diferido
    switch_datapoint: 106
    icon: mdi:timer-outline

select:
  - platform: tuya
    name: Seleccionar programa
    enum_datapoint: 3
    optimistic: false
    options:
      0: Ninguno
      1: Patatas
      2: Gambas
      3: Pizza
      4: Pollo
      5: Pescado
      6: Filete
      7: Muffin
      8: Bacon
      9: Precalentar
      10: Personalizado

number:
  - platform: tuya
    name: Ajustar tiempo de coccion
    number_datapoint: 7
    min_value: 1
    max_value: 60
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-sand
  - platform: template
    id: t21_temperatura_control
    name: Ajustar temperatura
    min_value: 77
    max_value: 204
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature
    mode: box
    icon: mdi:thermometer
    optimistic: false
    set_action:
      - lambda: |-
          id(t21_mcu).set_integer_datapoint_value(
            103,
            static_cast<uint32_t>(roundf(x * 9.0f / 5.0f + 32.0f))
          );
  - platform: tuya
    name: Minutos de inicio diferido
    number_datapoint: 6
    min_value: 5
    max_value: 720
    step: 5
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-plus-outline
  - platform: tuya
    name: Duracion de mantener caliente
    number_datapoint: 105
    min_value: 1
    max_value: 60
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-outline

sensor:
  - platform: tuya
    name: Tiempo configurado
    sensor_datapoint: 7
    unit_of_measurement: min
    accuracy_decimals: 0
  - platform: tuya
    name: Tiempo restante
    sensor_datapoint: 8
    unit_of_measurement: min
    accuracy_decimals: 0
  - platform: tuya
    name: Temperatura configurada
    sensor_datapoint: 103
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    filters:
      - lambda: return roundf((x - 32.0f) * 5.0f / 9.0f);
  - platform: tuya
    name: Temperatura interna
    sensor_datapoint: 107
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
  - platform: tuya
    name: Codigo de error
    sensor_datapoint: 12
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: wifi_signal
    name: Senal WiFi
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Tiempo encendido ESP
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: t21_programa
    name: Programa
    update_interval: never
  - platform: template
    id: t21_estado
    name: Estado de coccion
    update_interval: never
  - platform: version
    name: Version ESPHome
    entity_category: diagnostic
