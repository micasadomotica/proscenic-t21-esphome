# Locally validated on a real Proscenic T21.
# Controls only write documented and observed datapoints.
esphome:
  min_version: 2026.8.2

esp8266:
  board: d1_mini
  restore_from_flash: false

logger:
  baud_rate: 0
  level: INFO
  logs:
    tuya: INFO

uart:
  id: t21_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  parity: NONE
  stop_bits: 1

tuya:
  id: t21_mcu
  uart_id: t21_uart
  on_datapoint_update:
    - sensor_datapoint: 3
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) {
              case 0: id(t21_programa).publish_state("None"); break;
              case 1: id(t21_programa).publish_state("Fries"); break;
              case 2: id(t21_programa).publish_state("Shrimp"); break;
              case 3: id(t21_programa).publish_state("Pizza"); break;
              case 4: id(t21_programa).publish_state("Chicken"); break;
              case 5: id(t21_programa).publish_state("Fish"); break;
              case 6: id(t21_programa).publish_state("Steak"); break;
              case 7: id(t21_programa).publish_state("Muffin"); break;
              case 8: id(t21_programa).publish_state("Bacon"); break;
              case 9: id(t21_programa).publish_state("Preheat"); break;
              case 10: id(t21_programa).publish_state("Custom"); break;
              default: id(t21_programa).publish_state(str_sprintf("Unknown (%u)", x));
            }
    - sensor_datapoint: 5
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) {
              case 0: id(t21_estado).publish_state("Standby"); break;
              case 1: id(t21_estado).publish_state("Delayed Cook"); break;
              case 2: id(t21_estado).publish_state("Cooking"); break;
              case 3: id(t21_estado).publish_state("Keep Warm"); break;
              case 4: id(t21_estado).publish_state("Off"); break;
              case 5: id(t21_estado).publish_state("Cooking Complete"); break;
              default: id(t21_estado).publish_state(str_sprintf("Unknown (%u)", x));
            }
    - sensor_datapoint: 103
      datapoint_type: int
      then:
        - lambda: |-
            id(t21_temperatura_control).publish_state(
              roundf((static_cast<float>(x) - 32.0f) * 5.0f / 9.0f)
            );

binary_sensor:
  - platform: status
    name: ESPHome Connection
    entity_category: diagnostic
  - platform: tuya
    name: Fryer Powered
    sensor_datapoint: 1
    device_class: power
    icon: mdi:flash
  - platform: tuya
    name: Cooking Started
    sensor_datapoint: 2
    device_class: running
    icon: mdi:play
  - platform: tuya
    name: Basket Removed
    sensor_datapoint: 102
    device_class: opening
    icon: mdi:basket-remove
  - platform: tuya
    name: Keep Warm Active
    sensor_datapoint: 104
    icon: mdi:pot-steam
  - platform: tuya
    name: Delayed Cook Active
    sensor_datapoint: 106
    icon: mdi:calendar-clock

switch:
  - platform: tuya
    name: Activate Fryer
    switch_datapoint: 1
    icon: mdi:flash
  - platform: tuya
    name: Start/Pause Cooking
    switch_datapoint: 2
    icon: mdi:flash
  - platform: tuya
    name: Keep Warm
    switch_datapoint: 104
    icon: mdi:flash
  - platform: tuya
    name: Delayed Cook
    switch_datapoint: 106
    icon: mdi:flash

select:
  - platform: tuya
    name: Cookbook
    enum_datapoint: 3
    optimistic: false
    icon: mdi:chef-hat
    options:
      0: None
      1: Fries
      2: Shrimp
      3: Pizza
      4: Chicken
      5: Fish
      6: Steak
      7: Muffin
      8: Bacon
      9: Preheat
      10: Custom

number:
  - platform: tuya
    name: Cooking Time Set
    number_datapoint: 7
    min_value: 1
    max_value: 60
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-outline
  - platform: template
    id: t21_temperatura_control
    name: Cooking Temperature Set
    min_value: 77
    max_value: 204
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature
    mode: box
    icon: mdi:thermometer
    optimistic: false
    set_action:
      - lambda: |-
          id(t21_mcu).set_integer_datapoint_value(
            103,
            static_cast<uint32_t>(roundf(x * 9.0f / 5.0f + 32.0f))
          );
  - platform: tuya
    name: Delayed Cook Time Set
    number_datapoint: 6
    min_value: 5
    max_value: 720
    step: 5
    unit_of_measurement: min
    mode: box
    icon: mdi:calendar-clock
  - platform: tuya
    name: Keep Warm Time Set
    number_datapoint: 105
    min_value: 1
    max_value: 60
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:pot-steam

sensor:
  - platform: tuya
    name: Configured Cooking Time
    sensor_datapoint: 7
    unit_of_measurement: min
    accuracy_decimals: 0
    icon: mdi:timer-outline
  - platform: tuya
    name: Cooking Time Remaining
    sensor_datapoint: 8
    unit_of_measurement: min
    accuracy_decimals: 0
    icon: mdi:eye
  - platform: tuya
    name: Configured Temperature
    sensor_datapoint: 103
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    icon: mdi:thermometer
    filters:
      - lambda: return roundf((x - 32.0f) * 5.0f / 9.0f);
  - platform: tuya
    name: Internal Temperature
    sensor_datapoint: 107
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:thermometer
  - platform: tuya
    name: Error Code
    sensor_datapoint: 12
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:alert-circle-outline
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
    icon: mdi:wifi
  - platform: uptime
    name: ESP Uptime
    entity_category: diagnostic
    icon: mdi:clock-outline

text_sensor:
  - platform: template
    id: t21_programa
    name: Program
    update_interval: never
    icon: mdi:chef-hat
  - platform: template
    id: t21_estado
    name: Cooking Mode
    update_interval: never
    icon: mdi:pot-steam
  - platform: version
    name: ESPHome Version
    entity_category: diagnostic
